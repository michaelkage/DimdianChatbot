name: Tests

on:
  push:
    branches: [main, feat/multi-tenant-isolation]
  pull_request:
    branches: [main, feat/platform-foundation, feat/multi-tenant-isolation]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dimdian_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DIMDIAN_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=dimdian_test;charset=utf8mb4
      DIMDIAN_TEST_DB_USER: root
      DIMDIAN_TEST_DB_PASSWORD: root
      DIMDIAN_TEST_BASE_URL: http://127.0.0.1:8080
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          coverage: none
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint active PHP source
        run: |
          find app bin public tests wordpress-plugin -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l config.example.php
      - name: Prepare disposable database and app config
        run: |
          mysql -h127.0.0.1 -uroot -proot -e 'CREATE DATABASE IF NOT EXISTS dimdian_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          mysql -h127.0.0.1 -uroot -proot dimdian_test < database/schema.sql
          mysql -h127.0.0.1 -uroot -proot dimdian_test < database/migrations/004_multi_tenant_foundation.sql
          mysql -h127.0.0.1 -uroot -proot dimdian_test < database/migrations/005_tenant_ai_knowledge_handover.sql
          mysql -h127.0.0.1 -uroot -proot dimdian_test < database/migrations/006_tenant_api_keys_and_channel_events.sql
          mysql -h127.0.0.1 -uroot -proot dimdian_test < database/migrations/007_coexistence_sync.sql
          mysql -h127.0.0.1 -uroot -proot dimdian_test <<'SQL'
          INSERT INTO tenant_sites (tenant_id, origin, status, created_at, updated_at)
          VALUES ('00000000-0000-4000-8000-000000000001', 'https://website.example.test', 'verified', UTC_TIMESTAMP(), UTC_TIMESTAMP());
          INSERT INTO channel_connections (id, tenant_id, provider, business_account_id, phone_number_id, connection_status, created_at, updated_at)
          VALUES ('10000000-0000-4000-8000-000000000001', '00000000-0000-4000-8000-000000000001', 'meta', 'test-waba', 'test-phone-id', 'connected', UTC_TIMESTAMP(), UTC_TIMESTAMP());
          SQL
          cat > config.php <<'PHP'
          <?php
          return [
              'app' => [
                  'app_key' => str_repeat('a', 32),
                  'timezone' => 'UTC',
                  'tenant_id' => '00000000-0000-4000-8000-000000000001',
                  'encryption_key' => str_repeat('b', 64),
                  'allowed_origins' => ['https://website.example.test'],
                  'guest_session_ttl_hours' => 168,
                  'session_rate_limit' => ['max_requests' => 100, 'window_seconds' => 900],
                  'message_rate_limit' => ['max_requests' => 100, 'window_seconds' => 60],
              ],
              'database' => [
                  'dsn' => getenv('DIMDIAN_TEST_DSN'),
                  'username' => getenv('DIMDIAN_TEST_DB_USER'),
                  'password' => getenv('DIMDIAN_TEST_DB_PASSWORD'),
              ],
              'whatsapp' => [
                  'outbound_enabled' => false,
                  'app_secret' => 'test-meta-app-secret',
                  'verify_token' => 'test-webhook-token',
              ],
          ];
          PHP
      - name: Start local PHP API
        run: |
          php -S 127.0.0.1:8080 -t public > /tmp/dimdian-php-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:8080/api/session.php; then break; fi
            sleep 1
          done
      - name: Run PHP helper and HTTP/database integration tests
        run: |
          php tests/run.php
          php tests/ai.php
          php tests/meta.php
          php tests/integration.php
          php tests/wordpress-plugin.php
      - name: Check widget JavaScript syntax
        run: node --check public/widget.js
      - name: Run widget tests
        run: node --test tests/widget.test.mjs

  plugin-php-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.2']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Lint WordPress plugin and adapter tests
        run: |
          php -l wordpress-plugin/chatbridge-widget/chatbridge-widget.php
          php -l tests/wordpress-plugin.php
      - name: Run WooCommerce adapter contract tests
        run: php tests/wordpress-plugin.php
