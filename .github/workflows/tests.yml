name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint active PHP source
        run: |
          find app public tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l config.example.php
      - name: Run PHP unit tests
        run: php tests/run.php
      - name: Run widget tests
        run: node --test tests/widget.test.mjs
