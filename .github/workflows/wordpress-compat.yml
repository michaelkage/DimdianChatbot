name: WordPress and WooCommerce compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wordpress-plugin/**'
      - 'tests/wordpress-smoke-*.php'
      - '.wp-env.json'
      - '.github/workflows/wordpress-compat.yml'

permissions:
  contents: read

jobs:
  wordpress-woocommerce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install WordPress environment runner
        run: npm install --no-save --no-package-lock @wordpress/env

      - name: Start WordPress 7.1.4 and WooCommerce 11.3.0
        run: npx wp-env start

      - name: Install WordPress if needed
        run: |
          npx wp-env run cli wp core is-installed || \
            npx wp-env run cli wp core install \
              --url=http://localhost:8888 \
              --title="ChatBridge Compatibility Test" \
              --admin_user=admin \
              --admin_password=chatbridge-test-password \
              --admin_email=admin@example.test

      - name: Activate WooCommerce and ChatBridge
        run: |
          npx wp-env run cli wp plugin is-active woocommerce || npx wp-env run cli wp plugin activate woocommerce
          npx wp-env run cli wp plugin is-active chatbridge-widget || npx wp-env run cli wp plugin activate chatbridge-widget

      - name: Create public, hidden and draft product fixtures
        run: |
          npx wp-env run cli wp eval '
            update_option("chatbridge_widget_settings", [
              "enabled" => 1,
              "woocommerce_enabled" => 0,
              "api_base" => "https://chat.example.test/api",
              "title" => "Chat with us",
              "subtitle" => "Ask us a question."
            ]);
            $visible = new WC_Product_Simple();
            $visible->set_name("Brake Pad Set");
            $visible->set_sku("BP-001");
            $visible->set_regular_price("45000");
            $visible->set_status("publish");
            $visible->set_catalog_visibility("visible");
            $visible->set_stock_status("instock");
            $visible->save();
            $hidden = new WC_Product_Simple();
            $hidden->set_name("Secret Hidden Part");
            $hidden->set_sku("SECRET-HIDDEN");
            $hidden->set_regular_price("1000");
            $hidden->set_status("publish");
            $hidden->set_catalog_visibility("hidden");
            $hidden->save();
            $draft = new WC_Product_Simple();
            $draft->set_name("Unpublished Draft Part");
            $draft->set_sku("DRAFT-PART");
            $draft->set_regular_price("1000");
            $draft->set_status("draft");
            $draft->save();
            echo "Created public, hidden and draft fixtures.";
          '

      - name: Confirm product search is disabled by default
        run: |
          status=$(curl --silent --output /tmp/chatbridge-disabled.json --write-out '%{http_code}' \
            'http://localhost:8888/wp-json/chatbridge/v1/products?search=Brake')
          test "$status" = "403"
          grep -q 'product_search_disabled' /tmp/chatbridge-disabled.json

      - name: Enable product search for smoke tests
        run: |
          npx wp-env run cli wp eval '
            $settings = get_option("chatbridge_widget_settings", []);
            $settings["woocommerce_enabled"] = 1;
            update_option("chatbridge_widget_settings", $settings);
            echo "Enabled WooCommerce product search.";
          '

      - name: Verify partial product-name search
        run: |
          response=$(curl --fail --silent \
            'http://localhost:8888/wp-json/chatbridge/v1/products?search=Brake%20Pad')
          echo "$response" | jq -e '.count == 1 and .products[0].name == "Brake Pad Set" and .products[0].sku == "BP-001"'

      - name: Verify SKU search
        run: |
          response=$(curl --fail --silent \
            'http://localhost:8888/wp-json/chatbridge/v1/products?search=BP-001')
          echo "$response" | jq -e '.count == 1 and .products[0].name == "Brake Pad Set"'

      - name: Verify hidden and draft products stay private
        run: |
          hidden=$(curl --fail --silent \
            'http://localhost:8888/wp-json/chatbridge/v1/products?search=Secret%20Hidden')
          draft=$(curl --fail --silent \
            'http://localhost:8888/wp-json/chatbridge/v1/products?search=Unpublished%20Draft')
          echo "$hidden" | jq -e '.count == 0'
          echo "$draft" | jq -e '.count == 0'

      - name: Stop WordPress environment
        if: always()
        run: npx wp-env stop
