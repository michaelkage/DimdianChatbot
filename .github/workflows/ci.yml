name: Validate application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
      - name: Lint PHP source
        run: find app public bin -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Lint configuration template
        run: php -l config.example.php
      - name: Check widget JavaScript syntax
        run: node --check public/widget.js
