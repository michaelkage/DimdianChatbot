name: WordPress plugin coding standards

on:
  pull_request:
    paths:
      - 'wordpress-plugin/**'
      - '.github/workflows/plugin-quality.yml'
  push:
    branches:
      - main
    paths:
      - 'wordpress-plugin/**'
      - '.github/workflows/plugin-quality.yml'

permissions:
  contents: read

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Initialize temporary Composer project
        run: composer init --no-interaction --name=chatbridge/plugin-quality --type=project

      - name: Allow the PHPCS installer plugin
        run: composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true

      - name: Install WordPress Coding Standards
        run: composer require --dev wp-coding-standards/wpcs:^3.0

      - name: Verify centralized AJAX nonce and capability guards
        run: node --test tests/wordpress-security.test.mjs

      - name: Run targeted WordPress security sniffs
        run: >-
          vendor/bin/phpcs --standard=WordPress
          # Nonce checks are centralized in guarded AJAX helpers; the companion test verifies each route is wired to those guards.
          --sniffs=WordPress.Security.EscapeOutput,WordPress.Security.ValidatedSanitizedInput,WordPress.DB.PreparedSQL
          --extensions=php wordpress-plugin/chatbridge-widget
