name: WordPress plugin coding standards

on:
  pull_request:
    paths:
      - 'wordpress-plugin/**'
      - '.github/workflows/plugin-quality.yml'
  push:
    branches:
      - main
      - feat/multi-tenant-isolation
    paths:
      - 'wordpress-plugin/**'
      - '.github/workflows/plugin-quality.yml'

permissions:
  contents: read

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Initialize temporary Composer project
        run: composer init --no-interaction --name=chatbridge/plugin-quality --type=project

      - name: Allow the PHPCS installer plugin
        run: composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true

      - name: Install WordPress Coding Standards
        run: composer require --dev wp-coding-standards/wpcs:^3.0

      - name: Run PHPCS
        run: vendor/bin/phpcs --standard=WordPress --extensions=php wordpress-plugin/chatbridge-widget
